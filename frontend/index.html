<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epi-Radar | Surveillance Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="wrapper">
        <header class="main-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <i data-lucide="activity"></i>
                </div>
                <h1>Epi-<span class="highlight">Radar</span></h1>
            </div>
            
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search data, locations, or reports...">
                </div>
                <button class="btn-search">Search</button>
            </div>

            <div class="user-controls">
                <span class="welcome-text">Welcome, <span class="username">surveillance_lead</span></span>
                <button class="btn-logout">
                    <i data-lucide="log-out"></i>
                    Logout
                </button>
            </div>
        </header>

        <main class="dashboard-grid">
            <div class="grid-content">
                <a href="http://localhost:8503" target="_blank" class="nav-tile">
                    <div class="tile-icon pulse-blue">
                        <i data-lucide="layout-dashboard"></i>
                    </div>
                    <span class="tile-label">Surveillance Radar</span>
                </a>

                <a href="#" class="nav-tile">
                    <div class="tile-icon pulse-red">
                        <i data-lucide="map"></i>
                    </div>
                    <span class="tile-label">Global Hotspots</span>
                </a>

                <a href="http://localhost:8505" target="_blank" class="nav-tile">
                    <div class="tile-icon pulse-orange">
                        <i data-lucide="brain-circuit"></i>
                    </div>
                    <span class="tile-label">Disease Predictor</span>
                </a>

                <a href="#" class="nav-tile">
                    <div class="tile-icon pulse-green">
                        <i data-lucide="database"></i>
                    </div>
                    <span class="tile-label">Historical Logs</span>
                </a>

                <a href="#" class="nav-tile">
                    <div class="tile-icon pulse-purple">
                        <i data-lucide="settings"></i>
                    </div>
                    <span class="tile-label">System Config</span>
                </a>
                
                <a href="#" class="nav-tile">
                    <div class="tile-icon pulse-cyan">
                        <i data-lucide="help-circle"></i>
                    </div>
                    <span class="tile-label">Help Desk</span>
                </a>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 CODE CRAFTERS | Epidemic Outbreak Early Warning System</p>
        </footer>
    </div>

    <!-- Chatbot Components -->
    <div class="chatbot-fab" id="chatFab">
        <i data-lucide="message-square"></i>
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <h3>Epi-Bot Assistant</h3>
            <i data-lucide="x" style="cursor: pointer;" id="closeChat"></i>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                Hello! I'm Epi-Bot. How can I assist you with the bio-surveillance system today?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Type your message...">
            <button class="btn-send" id="sendMessage">
                <i data-lucide="send"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Chatbot Logic
        const chatFab = document.getElementById('chatFab');
        const chatWindow = document.getElementById('chatWindow');
        const closeChat = document.getElementById('closeChat');
        const chatInput = document.getElementById('chatInput');
        const sendMessage = document.getElementById('sendMessage');
        const chatMessages = document.getElementById('chatMessages');

        chatFab.addEventListener('click', () => {
            chatWindow.classList.toggle('active');
        });

        closeChat.addEventListener('click', () => {
            chatWindow.classList.remove('active');
        });

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            // Add typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'ai');
            typingDiv.innerText = 'Epi-Bot is thinking...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Remove typing indicator and add real response
                chatMessages.removeChild(typingDiv);
                addMessage(data.response || "I'm having trouble connecting right now.", 'ai');
            } catch (error) {
                chatMessages.removeChild(typingDiv);
                addMessage("Connection error. Please ensure the backend is running.", 'ai');
            }
        }

        sendMessage.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
